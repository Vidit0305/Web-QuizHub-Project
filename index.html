<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizHub - Java Basics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <span class="logo">QuizHub</span>
            <span class="nav-badge">Java Basics</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-wrapper">
        <div class="container">

            <!-- Error Banner -->
            <div id="error-banner" class="alert-banner" style="display: none;"></div>

            <!-- 1. Home / Start Screen -->
            <section id="start-screen" class="card text-center">
                <div class="pill-badge">QuizHub</div>
                <h1 class="card-title">Test Your Java Knowledge</h1>
                <p class="card-subtitle">
                    A quick 5-question quiz to test your fundamental understanding of Java basics.
                </p>

                <div class="info-chips">
                    <span class="info-chip">5 Questions</span>
                    <span class="info-chip">Java Basics</span>
                    <span class="info-chip">Quick Quiz</span>
                </div>

                <button class="btn btn-primary btn-block" onclick="startQuiz()">
                    Start Quiz &rarr;
                </button>
            </section>

            <!-- 2. Quiz Screen -->
            <section id="quiz-screen" class="card" style="display: none;">
                <div class="quiz-header">
                    <span class="question-counter" id="question-number">Question 1 of 5</span>
                    <span class="category-tag">Java Basics</span>
                </div>

                <div class="progress-track">
                    <div class="progress-fill" id="progress-bar"></div>
                </div>

                <h2 class="question-title" id="question-text"></h2>

                <div class="options-container" id="options">
                    <button class="option-card" onclick="selectAnswer('A')" id="optionA">
                        <span class="option-key">A</span>
                        <span class="option-text" id="optionA-text"></span>
                    </button>
                    <button class="option-card" onclick="selectAnswer('B')" id="optionB">
                        <span class="option-key">B</span>
                        <span class="option-text" id="optionB-text"></span>
                    </button>
                    <button class="option-card" onclick="selectAnswer('C')" id="optionC">
                        <span class="option-key">C</span>
                        <span class="option-text" id="optionC-text"></span>
                    </button>
                    <button class="option-card" onclick="selectAnswer('D')" id="optionD">
                        <span class="option-key">D</span>
                        <span class="option-text" id="optionD-text"></span>
                    </button>
                </div>

                <div class="quiz-footer">
                    <button id="next-button" class="btn btn-primary" onclick="nextQuestion()" disabled>
                        Next Question &rarr;
                    </button>
                </div>
            </section>

            <!-- 3. Result Screen -->
            <section id="result-screen" class="card text-center" style="display: none;">
                <div class="pill-badge">Quiz Complete</div>
                <h1 class="card-title">Quiz Result</h1>

                <div class="score-card">
                    <div class="score-fraction" id="score-fraction">4 / 5</div>
                    <div class="score-percentage" id="score-text">80%</div>
                    <p class="score-message" id="score-message">Great job! You have a solid grasp of Java basics.</p>
                </div>

                <button class="btn btn-primary btn-block" onclick="restartQuiz()">
                    Try Again
                </button>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
