<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizHub - Test Your Java Knowledge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Simple Top Navbar -->
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <span class="logo-text">QuizHub</span>
            </div>
            <div class="navbar-badge">Java Quiz</div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-content">
        <div class="container">

            <!-- 1. Start Screen -->
            <div id="start-screen" class="card">
                <div class="tag">JAVA QUIZ</div>
                <h1 class="card-title">Test Your Java Knowledge</h1>
                <p class="card-description">
                    Test your understanding of Java basics with a short 5-question quiz.
                </p>

                <button class="primary-btn start-btn" onclick="startQuiz()">
                    Start Quiz &rarr;
                </button>

                <div class="meta-info">
                    <span>5 Questions</span>
                    <span class="dot">&bull;</span>
                    <span>Java Basics</span>
                    <span class="dot">&bull;</span>
                    <span>Quick Quiz</span>
                </div>
            </div>

            <!-- 2. Quiz Screen -->
            <div id="quiz-screen" class="card" style="display: none;">
                <div class="quiz-header">
                    <span class="quiz-badge" id="question-number">QUESTION 1 OF 5</span>
                </div>

                <!-- Progress Bar -->
                <div class="progress-track">
                    <div class="progress-fill" id="progress-bar"></div>
                </div>

                <h2 class="question-title" id="question-text"></h2>

                <!-- Options -->
                <div class="options-container" id="options">
                    <button class="option-card" onclick="selectAnswer('A')" id="optionA">
                        <span class="option-key">A</span>
                        <span class="option-text" id="optionA-text"></span>
                    </button>
                    <button class="option-card" onclick="selectAnswer('B')" id="optionB">
                        <span class="option-key">B</span>
                        <span class="option-text" id="optionB-text"></span>
                    </button>
                    <button class="option-card" onclick="selectAnswer('C')" id="optionC">
                        <span class="option-key">C</span>
                        <span class="option-text" id="optionC-text"></span>
                    </button>
                    <button class="option-card" onclick="selectAnswer('D')" id="optionD">
                        <span class="option-key">D</span>
                        <span class="option-text" id="optionD-text"></span>
                    </button>
                </div>

                <div class="quiz-footer">
                    <button id="next-button" class="primary-btn next-btn" onclick="nextQuestion()" disabled>
                        Next Question &rarr;
                    </button>
                </div>
            </div>

            <!-- 3. Result Screen -->
            <div id="result-screen" class="card" style="display: none;">
                <div class="tag">QUIZ COMPLETED</div>
                <h2 class="card-title">Great job!</h2>

                <div class="score-box">
                    <span class="score-label">Your Score</span>
                    <div class="score-value" id="score-text">80%</div>
                    <p class="score-detail" id="correct-text">
                        You answered 4 out of 5 questions correctly.
                    </p>
                </div>

                <button class="primary-btn restart-btn" onclick="restartQuiz()">
                    Try Again
                </button>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
